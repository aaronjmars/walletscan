name: publish
# Releases a new version when package.json on main has a version with no vX.Y.Z tag yet.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: New version?
        id: v
        run: |
          v="$(node -p 'require("./package.json").version')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  npm:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Skip when this version is already on npm
        id: npm
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${{ needs.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Auth via OIDC trusted publishing (set on npmjs.com, workflow publish.yml): no token. Needs npm >= 11.5, Node 24 ships it.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public

  github-packages:
    needs: [check, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@aaronjmars"
      # GitHub Packages only takes names scoped to the repo owner
      - run: npm pkg set name=@aaronjmars/walletscan-cli
      - name: Skip when this version is already on GitHub Packages
        id: gpr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@aaronjmars/walletscan-cli@${{ needs.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gpr.outputs.published != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [check, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Creates the vX.Y.Z tag on this commit. Tags made with GITHUB_TOKEN start no workflow, so this cannot loop.
      - name: Tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$V" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
            --notes "Install: \`npm i -g walletscan-cli\` ([npm](https://www.npmjs.com/package/walletscan-cli/v/$V))"
